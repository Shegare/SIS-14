- type: entity
  parent: WeatherBase
  id: PoppyPlayTime
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_SIS/Effects/weater.rsi
      state: empty
    sound:
      path: /Audio/_SIS/Effects/Weather/poppy.ogg
      params:
        loop: true
        volume: -9

- type: entity
  parent: WeatherBase
  id: light
  components:
  - type: WeatherStatusEffect
    sprite:
      sprite: /Textures/_SIS/Effects/weater.rsi
      state: empty
    sound:
      path: /Audio/_SIS/Effects/Weather/light.ogg
      params:
        loop: true
        volume: -1
